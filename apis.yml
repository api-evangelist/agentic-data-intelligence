name: Agentic Data Intelligence
description: 'Agentic Data Intelligence SA (ADI) is a Swiss-headquartered startup building
  the control plane for AI data analytics: a thin semantics-and-control layer that sits
  between AI agents and data. ADI automatically generates machine-readable semantics and
  an enforceable contract (rules) that governs how copilots and agents conduct data analysis,
  improving governance, accuracy, and consistency while lowering inference cost. It never
  sees the underlying data, generating the contract from schema and context and running
  analysis locally. The Starter Edition targets coding agents and IDEs (Claude Code, Cursor,
  Manus) delivered via SKILL.md files, plugins, and MCP Servers; the Enterprise Edition
  extends cloud data warehouses (Snowflake, Databricks, dbt). Backed by Electric Capital
  and supporting the Open Semantic Interchange (OSI) initiative. Currently in limited alpha,
  accepting first partners via a waitlist.'
